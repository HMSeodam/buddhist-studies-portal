name: 논문 데이터 업데이트

'on':
  schedule:
    # ── RISS: 매주 월요일 오전 9시 KST (UTC 00:00)
    - cron: "0 0 * * 1"
    # ── IBK: 매월 1일 오전 9시 KST (UTC 00:00) — 연 2회 발행이므로 월 1회 체크로 충분
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      target:
        description: "업데이트 대상 (riss / ibk / all)"
        required: false
        default: "all"
      depth:
        description: "확인할 최신 호수 개수"
        required: false
        default: "2"
      journal:
        description: "RISS에서 업데이트할 학회지 이름 (공백 구분 여러 개 가능)"
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 0. 체크아웃 ───────────────────────────────────────────────────────
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # ── 1. 환경 설정 ──────────────────────────────────────────────────────
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v1

      - name: Python 패키지 설치
        run: pip install -r collector/requirements.txt

      # ── 2. 스케줄 트리거 판별 ─────────────────────────────────────────────
      # schedule 트리거는 workflow_dispatch.inputs 가 없으므로 날짜로 구분
      - name: 업데이트 대상 결정
        id: target
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then
            # schedule 트리거: 1일이면 IBK 포함, 그 외는 RISS만
            DAY=$(date +'%d')
            if [ "$DAY" = "01" ]; then
              TARGET="all"
            else
              TARGET="riss"
            fi
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "▶ 업데이트 대상: $TARGET"

      # ── 3. RISS 업데이트 ──────────────────────────────────────────────────
      - name: RISS 증분 업데이트
        if: steps.target.outputs.target == 'riss' || steps.target.outputs.target == 'all'
        run: |
          DEPTH="${{ github.event.inputs.depth || '1' }}"
          JOURNAL="${{ github.event.inputs.journal || '' }}"
          cd collector
          if [ -n "$JOURNAL" ]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' python riss_updater.py --depth "$DEPTH" --humanize --no-headless --journal $JOURNAL
          else
            xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' python riss_updater.py --depth "$DEPTH" --humanize --no-headless
          fi
        env:
          DISPLAY: ""

      # ── 4. IBK 업데이트 ───────────────────────────────────────────────────
      - name: IBK 印度學佛教學研究 증분 업데이트
        if: steps.target.outputs.target == 'ibk' || steps.target.outputs.target == 'all'
        run: |
          DEPTH="${{ github.event.inputs.depth || '2' }}"
          cd collector
          python ibk_updater.py --depth "$DEPTH"
        env:
          DISPLAY: ""

      # ── 5. 변경 감지 ──────────────────────────────────────────────────────
      - name: 변경된 파일 확인
        id: changes
        run: |
          git diff --name-only output/
          CHANGED=$(git diff --name-only output/ | wc -l)
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          if [ "$CHANGED" -gt "0" ]; then
            echo "변경된 파일:"
            git diff --name-only output/
          else
            echo "변경 없음"
          fi

      # ── 6. 커밋 & 푸시 ────────────────────────────────────────────────────
      - name: 변경 사항 커밋 & 푸시
        if: steps.changes.outputs.changed != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          # 어떤 대상이 업데이트됐는지 커밋 메시지에 반영
          TARGET="${{ steps.target.outputs.target }}"
          DATE=$(date +'%Y-%m-%d')
          if [ "$TARGET" = "riss" ]; then
            MSG="data: RISS 업데이트 $DATE"
          elif [ "$TARGET" = "ibk" ]; then
            MSG="data: IBK 업데이트 $DATE"
          else
            MSG="data: RISS+IBK 업데이트 $DATE"
          fi
          git commit -m "$MSG"
          git push

      - name: 업데이트 없음 안내
        if: steps.changes.outputs.changed == '0'
        run: echo "새 논문 없음 — 커밋 건너뜀"
