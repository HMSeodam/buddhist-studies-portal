name: RISS 논문 주간 업데이트

on:
  schedule:
    # 매주 월요일 오전 9시 KST (= UTC 00:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # 수동 실행 버튼 (테스트용)
    inputs:
      depth:
        description: "확인할 최신 호수 개수"
        required: false
        default: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 파일 커밋/푸시 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v1

      - name: Python 패키지 설치
        run: pip install -r collector/requirements.txt

      - name: RISS 증분 업데이트 실행
        run: |
          DEPTH=${{ github.event.inputs.depth || '1' }}
          cd collector
          python riss_updater.py --depth $DEPTH
        env:
          # Selenium headless 환경 설정
          DISPLAY: ""

      - name: 변경된 파일 확인
        id: changes
        run: |
          git diff --name-only output/
          CHANGED=$(git diff --name-only output/ | wc -l)
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: 변경 사항 커밋 & 푸시
        if: steps.changes.outputs.changed != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "data: RISS 주간 업데이트 $(date +'%Y-%m-%d')"
          git push

      - name: 업데이트 없음 안내
        if: steps.changes.outputs.changed == '0'
        run: echo "새 논문 없음 — 커밋 건너뜀"
