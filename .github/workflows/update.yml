name: 논문 데이터 업데이트 (요일별 분산)

on:
  schedule:
    - cron: "0 13 * * 1"   # 월요일 22:00 KST
    - cron: "0 12 * * 2"   # 화요일 21:00 KST
    - cron: "0 13 * * 3"   # 수요일 22:00 KST
    - cron: "0 11 * * 4"   # 목요일 20:00 KST
    - cron: "0 13 * * 5"   # 금요일 22:00 KST
    - cron: "0 12 * * 6"   # 토요일 21:00 KST
    - cron: "0 11 * * 0"   # 일요일 20:00 KST (전체 점검)
    - cron: "0 13 1 * *"   # 매월 1일 22:00 KST (IBK)
  workflow_dispatch:
    inputs:
      day:
        description: "요일 지정 (mon/tue/wed/thu/fri/sat/sun/all)"
        required: false
        default: ""
      target:
        description: "실행 대상 (riss/ibk/all)"
        required: false
        default: "riss"
      depth:
        description: "RISS 확인할 최신 호수 개수 (1 또는 2, 기본: 요일 설정 따름)"
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v1

      - name: Python 패키지 설치
        run: pip install -r collector/requirements.txt

      # ── 요일 판별 ────────────────────────────────────────────
      - name: 실행 요일 결정
        id: day
        run: |
          DAY_INPUT="${{ github.event.inputs.day }}"
          if [ -n "$DAY_INPUT" ]; then
            DAY="$DAY_INPUT"
          else
            # 스케줄 트리거: 오늘 요일 자동 판별
            DOW=$(date +'%u')   # 1=월 ... 7=일
            case $DOW in
              1) DAY="mon" ;;
              2) DAY="tue" ;;
              3) DAY="wed" ;;
              4) DAY="thu" ;;
              5) DAY="fri" ;;
              6) DAY="sat" ;;
              7) DAY="sun" ;;
            esac
          fi
          echo "day=$DAY" >> $GITHUB_OUTPUT
          echo "▶ 실행 요일: $DAY"

      # ── RISS 업데이트 ─────────────────────────────────────────
      - name: RISS 요일별 업데이트
        if: >
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'riss' ||
          github.event.inputs.target == 'all'
        run: |
          DEPTH="${{ github.event.inputs.depth }}"
          if [ -n "$DEPTH" ]; then
            cd collector && python riss_updater.py --day "${{ steps.day.outputs.day }}" --depth "$DEPTH"
          else
            cd collector && python riss_updater.py --day "${{ steps.day.outputs.day }}"
          fi
        env:
          DISPLAY: ""

      # ── IBK 업데이트 (매월 1일 또는 수동) ────────────────────
      - name: 매월 1일 여부 확인
        id: ibk_check
        run: |
          DAY=$(date +'%d')
          TARGET="${{ github.event.inputs.target }}"
          if [ "$DAY" = "01" ] || [ "$TARGET" = "ibk" ] || [ "$TARGET" = "all" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: IBK 업데이트
        if: steps.ibk_check.outputs.run == 'true'
        run: |
          cd collector
          python ibk_updater.py --depth 2
        env:
          DISPLAY: ""

      # ── 변경 감지 & 커밋 ─────────────────────────────────────
      - name: 변경된 파일 확인
        id: changes
        run: |
          CHANGED=$(git diff --name-only output/ | wc -l)
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          if [ "$CHANGED" -gt "0" ]; then
            echo "변경된 파일:"
            git diff --name-only output/
          else
            echo "변경 없음"
          fi

      - name: 커밋 & 푸시
        if: steps.changes.outputs.changed != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          DAY="${{ steps.day.outputs.day }}"
          DATE=$(date +'%Y-%m-%d')
          git commit -m "data: RISS 업데이트 [$DAY] $DATE"
          git pull --rebase origin main
          git push

      - name: 업데이트 없음 안내
        if: steps.changes.outputs.changed == '0'
        run: echo "새 논문 없음 — 커밋 건너뜀"
